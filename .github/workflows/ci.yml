name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Test
        run: |
          sudo -E env "PATH=$PATH" go test -v -count=1 -coverprofile=coverage.out $(ls *.go | grep -v _test) $(ls *_test.go)
          go tool cover -func=coverage.out | tail -1

      - name: Coverage gate
        run: |
          COVER=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          awk -v c="$COVER" 'BEGIN { if (c < 86.0) { print "Coverage " c "% below 86% gate"; exit 1 } print "Coverage OK: " c "%" }'

      - name: Vet
        run: go vet $(ls *.go | grep -v _test)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upload UI cancellation and retry
        run: node --test tests/upload-ui.test.cjs

      - name: Cross-compile ARM
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 go build -trimpath -o /dev/null $(ls *.go | grep -v _test)

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Fuzz smoke test
        run: |
          go test -run "^$" -fuzz "^FuzzParseDigestHeader$" -fuzztime 10s $(ls *.go | grep -v _test) fuzz_test.go
          go test -run "^$" -fuzz "^FuzzParseNativeApply$" -fuzztime 10s $(ls *.go | grep -v _test) fuzz_test.go
          go test -run "^$" -fuzz "^FuzzFTPCommandParsing$" -fuzztime 10s $(ls *.go | grep -v _test) fuzz_test.go

  release:
    needs: [test, fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zip

      - name: Build and validate PocketBook package
        run: |
          sh release.sh
          python3 publish_release.py --validate-only
          go version -m build/WiFiFiles.server

      - name: Publish Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_SERVER_URL: http://gitea:3000
        run: python3 publish_release.py --ci
