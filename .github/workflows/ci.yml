name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test -v -count=1 server.go mobile.go webdav.go webdav_ui.go qr.go ftp.go smb.go filenames.go library.go auth.go logging.go paths.go upload.go server_test.go mobile_test.go webdav_test.go qr_test.go portable_upload_test.go

      - name: Vet
        run: go vet server.go mobile.go webdav.go webdav_ui.go qr.go ftp.go smb.go filenames.go library.go auth.go logging.go paths.go upload.go

      - name: Cross-compile ARM
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 go build -trimpath server.go mobile.go webdav.go webdav_ui.go qr.go ftp.go smb.go filenames.go library.go auth.go logging.go paths.go upload.go

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Fuzz smoke test
        run: |
          go test -run "^$" -fuzz "^FuzzParseDigestHeader$" -fuzztime 10s server.go mobile.go webdav.go webdav_ui.go qr.go ftp.go smb.go filenames.go library.go auth.go logging.go paths.go upload.go fuzz_test.go
          go test -run "^$" -fuzz "^FuzzParseNativeApply$" -fuzztime 10s server.go mobile.go webdav.go webdav_ui.go qr.go ftp.go smb.go filenames.go library.go auth.go logging.go paths.go upload.go fuzz_test.go
          go test -run "^$" -fuzz "^FuzzFTPCommandParsing$" -fuzztime 10s server.go mobile.go webdav.go webdav_ui.go qr.go ftp.go smb.go filenames.go library.go auth.go logging.go paths.go upload.go fuzz_test.go
